<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Media Page</title>
        <style>
            table {
                font-family: arial, sans-serif;
                font-size: 15px;
                border-collapse: collapse;
                width: 85%;
            }
            td, th {
                border: 1px solid #dddddd;
                text-align: left;
                padding: 8px;
            }
            body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
            }
            .topnav {
                overflow: hidden;
                background-color: #333;
            }
            .topnav a {
                float: left;
                color: #f2f2f2;
                text-align: center;
                padding: 12px 14px;
                text-decoration: none;
                font-size: 15px;
            }
            .topnav a:hover {
                background-color: #ddd;
                color: black;
            }
            .topnav a.active {
                background-color: #04AA6D;
                color: white;
            }
        </style>
    </head>
    <body>
        <div class="media-page-body">
            <header role="banner">
                <h1 id="header">Media Page</h1>
            </header>

            <div id="nav_bar" class="topnav" role="navigation">
                <a id="form_link" href="basic_test_page.html">Basic HTML Form</a>
                <a id="media_link" class="active" href="#">Media</a>
                <a id="indexed_sections_link" href="indexed_sections_page.html">Indexed Sections</a>
                <a id="custom_controls_link" href="custom_controls_page.html">Custom Controls</a>
            </div>

            <table role="main">
                <tbody>
                    <tr>
                        <td>
                            <h2 id="video1">Video:</h2>
                            <video id="video_player1" width="480" height="360" controls>
                                <source src="media/count_and_bars.mp4" type="video/mp4">
                            </video>
                        </td>
                        <td>
                            <h2 id="video2">Video with Captions:</h2>
                            <video id="video_player2" width="520" controls>
                                <source src="media/sintel-short.mp4" type="video/mp4">
                                <track src="subtitles/sintel-en.vtt" kind="subtitles" srclang="en" label="English" default>
                                <track src="subtitles/sintel-es.vtt" kind="subtitles" srclang="es" label="Spanish">
                                <track src="subtitles/sintel-de.vtt" kind="subtitles" srclang="de" label="German">
                            </video>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <h2 id="audio1">Audio:</h2>
                            <audio id="audio_player1" controls>
                                <source src="media/bbc_scotland_report.mp3" type="audio/mp3">
                            </audio>
                        </td>
                        <td>
                            <h2 id="audio2">Audio with Captions:</h2>
                            <audio id="audio_player2" controls>
                                <source src="media/bbc-pm.mp3" type="audio/mp3">
                                <track src="subtitles/bbc-pm.vtt" kind="subtitles" srclang="en" label="English" default>
                            </audio>
                            <div style="display:none;text-align:center;font-family:monospace;font-weight:bold;text-wrap:balance" id="vtt-text"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <script>
            // Safari needs to be specifically told to show this track, for some reason.
            document.getElementById('audio_player2').textTracks[0].mode="showing";

            document.getElementById('audio_player2').addEventListener('play', function() {
                //We hid the captions in the div above, since Safari shows them on page load
                //Now the listener has hit play, show them.
                document.getElementById('vtt-text').style.display="block";
            });

            document.getElementById('audio_player2').textTracks[0].addEventListener('cuechange', function() {
                //Update the caption
                document.getElementById('vtt-text').innerText = this.activeCues[0].text;
            });
        </script>
    </body>
</html>
